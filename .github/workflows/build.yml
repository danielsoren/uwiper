name: Build

# Every push and pull request builds and tests on Windows.
# Pushing a tag like v0.1.0 also publishes a GitHub release.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Same version as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      # Each Rust step keeps its output in a log so a failure can be shown
      # as annotations (readable through the API without downloading logs).
      - name: Clippy
        working-directory: backend
        run: |
          set -o pipefail
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee ../ci-clippy.log

      - name: Unit tests
        working-directory: backend
        run: |
          set -o pipefail
          cargo test 2>&1 | tee ../ci-test.log

      - name: Build app
        run: |
          set -o pipefail
          npx tauri build --no-bundle 2>&1 | tee ci-build.log

      - name: Report failure
        if: failure()
        run: |
          for log in ci-*.log; do
            [ -f "$log" ] || continue
            lines=$(grep -E "^(error|warning)|error\[|panicked|FAILED" "$log" | head -n 10)
            [ -n "$lines" ] || lines=$(tail -n 10 "$log")
            while IFS= read -r line; do echo "::error title=$log::$line"; done <<< "$lines"
          done

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/UWiper | Out-Null
          Copy-Item backend/target/release/uwiper.exe out/UWiper/UWiper.exe
          Compress-Archive -Path out/UWiper -DestinationPath out/UWiper-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: UWiper-${{ github.sha }}
          path: |
            out/UWiper-portable.zip
            out/UWiper/UWiper.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: UWiper-${{ github.sha }}
          path: out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release notes are the CHANGELOG.md section for this version.
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "UWiper $TAG" > notes.md

          mv out/UWiper-portable.zip "out/UWiper-$TAG-portable.zip"
          gh release create "$TAG" \
            --title "UWiper $TAG" \
            --notes-file notes.md \
            "out/UWiper-$TAG-portable.zip" \
            out/UWiper/UWiper.exe
