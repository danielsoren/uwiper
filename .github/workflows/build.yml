name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Same version as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      # Each Rust step keeps its output in a log so a failure can be shown
      # as annotations (readable through the API without downloading logs).
      - name: Clippy
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo clippy --all-targets --message-format=short -- -D warnings 2>&1 | tee ../ci-clippy.log

      - name: Unit tests
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test 2>&1 | tee ../ci-test.log

      - name: Build app
        run: |
          set -o pipefail
          npx tauri build --no-bundle 2>&1 | tee ci-build.log

      - name: Report failure
        if: failure()
        run: |
          for log in ci-*.log; do
            [ -f "$log" ] || continue
            lines=$(grep -E "^(error|warning)|error\[|panicked|FAILED" "$log" | head -n 10)
            [ -n "$lines" ] || lines=$(tail -n 10 "$log")
            while IFS= read -r line; do echo "::error title=$log::$line"; done <<< "$lines"
          done

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable/UWiper | Out-Null
          Copy-Item src-tauri/target/release/uwiper.exe portable/UWiper/UWiper.exe
          Compress-Archive -Path portable/UWiper -DestinationPath UWiper-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: UWiper-portable-${{ github.sha }}
          path: UWiper-portable.zip
          if-no-files-found: error
